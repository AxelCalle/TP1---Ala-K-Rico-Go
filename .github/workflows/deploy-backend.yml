# ─── Deploy Backend → Azure App Service ──────────────────────────────────────
# Disparado automáticamente al hacer push a main con cambios en server/
# También puede ejecutarse manualmente desde la pestaña Actions en GitHub.
#
# SECRETOS requeridos (GitHub → Settings → Secrets → Actions):
#   AZURE_KUDU_USERNAME  — userName del publish profile (ej: $ala-k-rico-go)
#   AZURE_KUDU_PASSWORD  — userPWD del publish profile
#
# VARIABLES requeridas (GitHub → Settings → Variables → Actions):
#   AZURE_KUDU_URL       — ej: ala-k-rico-go-xxxx.scm.chilecentral-01.azurewebsites.net
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Backend — Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy API

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Crear paquete ZIP
        run: zip -r deploy.zip server/ -x "*.git*" -x "server/node_modules/*"

      - name: Desplegar via Kudu ZIP Deploy
        env:
          KUDU_USER: ${{ secrets.AZURE_KUDU_USERNAME }}
          KUDU_PASS: ${{ secrets.AZURE_KUDU_PASSWORD }}
          KUDU_URL: ${{ vars.AZURE_KUDU_URL }}
        run: |
          curl -X POST \
            "https://${KUDU_URL}/api/zipdeploy" \
            --user "${KUDU_USER}:${KUDU_PASS}" \
            --data-binary @deploy.zip \
            -H "Content-Type: application/octet-stream" \
            --fail \
            --show-error
