# ─── Deploy Backend → Azure App Service ──────────────────────────────────────
# Disparado automáticamente al hacer push a main con cambios en server/
# También puede ejecutarse manualmente desde la pestaña Actions en GitHub.
#
# SECRETOS requeridos (configurar en GitHub → Settings → Secrets → Actions):
#   AZURE_WEBAPP_PUBLISH_PROFILE  — descargarlo desde Azure Portal → App Service
#                                   → Get publish profile (botón en la barra)
#
# VARIABLES requeridas (GitHub → Settings → Variables → Actions):
#   AZURE_WEBAPP_NAME             — ala-k-rico-go
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Backend — Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy API

    steps:
      # 1. Checkout
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # 3. Instalar dependencias de producción
      - name: Instalar dependencias
        working-directory: server
        run: npm install --omit=dev

      # 4. Deploy al App Service
      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: server
