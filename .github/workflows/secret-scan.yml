# ─── Escaneo de secretos (gitleaks) ──────────────────────────────────────────
# Falla el push/PR si detecta credenciales (JWT_SECRET, contraseñas de BD,
# tokens, publish profiles…) en los commits nuevos.
# Los secretos reales van en Azure App Service y en GitHub → Settings → Secrets.
# ─────────────────────────────────────────────────────────────────────────────
name: Escaneo de secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
